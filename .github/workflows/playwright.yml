name: Playwright Tests + Allure Report (Docker)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests (Docker Compose)
        env:
          ENV: qa
          STANDARD_USER: standard_user
          STANDARD_PASSWORD: secret_sauce
          LOCKED_USER: locked_out_user
          LOCKED_PASSWORD: secret_sauce
          BASE_URL: https://www.saucedemo.com
          TEST_TIMEOUT: 30000
          EXPECT_TIMEOUT: 5000
        run: docker compose up --abort-on-container-exit

      - name: Verify Allure results exist
        run: |
          echo "Checking allure-results..."
          ls -R allure-results
          test -d allure-results || (echo "❌ allure-results missing" && exit 1)

      - name: Generate Allure report (clean)
        run: npx allure generate allure-results -o allure-report

      - name: Upload Allure report artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4